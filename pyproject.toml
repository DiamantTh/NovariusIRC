[project]
name = "novariusirc"
version = "0.1.5"
description = "Modular, multilingual IRC bot/daemon inspired by Eggdrop"
authors = [
    { name = "Thomas Winkelmann (DiamantTh)", email = "thomas.winkelmann@wkmn-web.eu" },
]
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "tornado>=6.5.8,<7.0.0",
    "feedparser>=6.0.14,<7.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "SQLAlchemy>=2.0.48,<3.0.0",
    "alembic>=1.18.0,<2.0.0",
    "tzdata>=2025.3,<2027.0",
    "typer (>=0.27.2,<0.28.0)",
    "packaging>=26.0,<27.0",
]

[project.optional-dependencies]
journald = ["systemd-python>=235,<236"]
uvloop = ["uvloop>=0.22.1,<0.23.0"]
monitoring = ["psutil>=7.2,<8.0"]

[project.scripts]
novariusirc = "novariusirc.__main__:main"

[tool.poetry]
packages = [{ include = "novariusirc" }]
include = [
    { path = "novariusirc/_build_info.json", format = ["sdist", "wheel"] },
    { path = "novariusirc/locales/**/*.mo", format = ["sdist", "wheel"] },
    { path = "novariusirc/locales/**/*.po", format = ["sdist"] },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.16.4"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
