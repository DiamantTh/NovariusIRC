# Moderationskonfiguration für NovariusIRC
# Alle Einstellungen sind optional; fehlende Werte erhalten ihre Standardwerte.

# GLOBALE STANDARDWERTE (gelten ohne kanalspezifische Überschreibung)
[moderation]
enabled = true
log_file = "logs/moderation/moderation.log"

# Standardmäßige Nachrichtenbegrenzung
[moderation.rate_limit]
enabled = false
messages_per_minute = 5
action = "warn"

# Standardmäßige Erkennung wiederholter Nachrichten
[moderation.spam]
enabled = false
threshold = 3
action = "mute"
duration_seconds = 300

# Standardmäßige Erkennung übermäßiger Großschreibung
[moderation.caps]
enabled = false
threshold_percent = 80
action = "warn"

# Standardmäßiger Wort-/RegExp-Filter
[moderation.badwords]
enabled = false
action = "warn"
list = []

# Standardmäßiges Verwarnungssystem
[moderation.warnings]
enabled = true
to_kick = 3
to_ban = 5

# ============================================================
# KANALSPEZIFISCHE ÜBERSCHREIBUNGEN
# Jeder Kanal kann einzelne oder alle globalen Einstellungen überschreiben.
# ============================================================

# Streng moderierter Kanal
[moderation.channels."#strict"]
enabled = true

# Alle Prüfungen in #strict aktivieren
[moderation.channels."#strict".rate_limit]
enabled = true
messages_per_minute = 3
action = "mute"

[moderation.channels."#strict".spam]
enabled = true
threshold = 2
action = "kick"
duration_seconds = 600

[moderation.channels."#strict".caps]
enabled = true
threshold_percent = 70
action = "warn"

[moderation.channels."#strict".badwords]
enabled = true
action = "warn"
list = [
    "badword1",
    "badword2",
    "(?i)spam.*",
]

[moderation.channels."#strict".warnings]
enabled = true
to_kick = 2
to_ban = 3

# Lockerer Kanal mit minimaler Moderation
[moderation.channels."#chill"]
enabled = true

[moderation.channels."#chill".rate_limit]
enabled = false

[moderation.channels."#chill".spam]
enabled = false

[moderation.channels."#chill".caps]
enabled = false

[moderation.channels."#chill".badwords]
enabled = false

[moderation.channels."#chill".warnings]
enabled = false
to_kick = 999  # Praktisch kein automatischer Kick
to_ban = 999   # Praktisch kein automatischer Ban

# Ankündigungskanal nur mit Spam-Schutz
[moderation.channels."#announce"]
enabled = true

[moderation.channels."#announce".rate_limit]
enabled = true
messages_per_minute = 1
action = "kick"

[moderation.channels."#announce".spam]
enabled = true
threshold = 2
action = "kick"

[moderation.channels."#announce".caps]
enabled = false

[moderation.channels."#announce".badwords]
enabled = false

[moderation.channels."#announce".warnings]
enabled = false
