# Moderation configuration for NovariusIRC
# All settings are optional - defaults are used if not specified

# GLOBAL DEFAULTS (applied to all channels unless overridden)
[moderation]
enabled = true
log_file = "logs/moderation.log"

# Default rate limiting (can be overridden per channel)
[moderation.rate_limit]
enabled = false
messages_per_minute = 5
action = "warn"

# Default spam detection
[moderation.spam]
enabled = false
threshold = 3
action = "mute"
duration_seconds = 300

# Default caps lock detection
[moderation.caps]
enabled = false
threshold_percent = 80
action = "warn"

# Default badword filtering
[moderation.badwords]
enabled = false
action = "warn"
list = []

# Default warning system
[moderation.warnings]
enabled = true
to_kick = 3
to_ban = 5

# ============================================================
# CHANNEL-SPECIFIC OVERRIDES
# Each channel can override any/all of the above settings
# ============================================================

# Strict moderation channel
[moderation.channels."#strict"]
enabled = true

# Enable all checks in #strict
[moderation.channels."#strict".rate_limit]
enabled = true
messages_per_minute = 3
action = "mute"

[moderation.channels."#strict".spam]
enabled = true
threshold = 2
action = "kick"
duration_seconds = 600

[moderation.channels."#strict".caps]
enabled = true
threshold_percent = 70
action = "warn"

[moderation.channels."#strict".badwords]
enabled = true
action = "warn"
list = [
    "badword1",
    "badword2",
    "(?i)spam.*",
]

[moderation.channels."#strict".warnings]
enabled = true
to_kick = 2
to_ban = 3

# Chill/casual channel - minimal moderation
[moderation.channels."#chill"]
enabled = true

[moderation.channels."#chill".rate_limit]
enabled = false

[moderation.channels."#chill".spam]
enabled = false

[moderation.channels."#chill".caps]
enabled = false

[moderation.channels."#chill".badwords]
enabled = false

[moderation.channels."#chill".warnings]
enabled = false
to_kick = 999  # Never auto-kick
to_ban = 999   # Never auto-ban

# Announcements channel - only anti-spam
[moderation.channels."#announce"]
enabled = true

[moderation.channels."#announce".rate_limit]
enabled = true
messages_per_minute = 1
action = "kick"

[moderation.channels."#announce".spam]
enabled = true
threshold = 2
action = "kick"

[moderation.channels."#announce".caps]
enabled = false

[moderation.channels."#announce".badwords]
enabled = false

[moderation.channels."#announce".warnings]
enabled = false
