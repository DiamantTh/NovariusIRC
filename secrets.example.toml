# secrets.toml - Sensible Daten (NICHT ins Git committen!)
# Kopiere diese Datei nach secrets.toml und trage deine echten Credentials ein
# Die secrets.toml wird automatisch geladen, wenn sie im selben Verzeichnis wie config.toml liegt

[auth]
# SASL Password für die Authentifizierung am IRC-Server
sasl_password = "dein_sasl_passwort_hier"

# NickServ Password für die Nick-Registrierung
nickserv_password = "dein_nickserv_passwort_hier"

# Optional: CertFP-Dateipfade (falls nicht in config.toml gepflegt)
# certfp_cert_file = "/opt/novariusirc/certs/irc-client.pem"
# certfp_key_file = "/opt/novariusirc/certs/irc-client.key"
